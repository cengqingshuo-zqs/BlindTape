<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BlindTape 双盲K线训练</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<div id="app">

  <header id="status-bar">
    <span id="progress-label">未开始</span>
    <span id="position-label">仓位 0成（¥0）</span>
    <button id="btn-finish" class="finish-link">结束训练/揭晓</button>
  </header>

  <div id="ma-row">
    <span class="ma-label">MA</span>
    <input type="number" class="ma-input" data-idx="0" min="0" max="200" value="5">
    <input type="number" class="ma-input" data-idx="1" min="0" max="200" value="20">
    <input type="number" class="ma-input" data-idx="2" min="0" max="200" value="">
    <input type="number" class="ma-input" data-idx="3" min="0" max="200" value="">
  </div>

  <div id="chart-container"></div>

  <div id="trade-row">
    <div class="trade-btn-wrap">
      <div id="buy-menu" class="trade-menu hidden"></div>
      <button id="btn-buy" class="trade-btn buy">
        <span class="trade-btn-title">买入</span>
        <span class="trade-btn-hint" id="buy-hint">可买10/10仓</span>
      </button>
    </div>
    <button id="btn-hold" class="trade-btn hold">观望</button>
    <div class="trade-btn-wrap">
      <div id="sell-menu" class="trade-menu hidden"></div>
      <button id="btn-sell" class="trade-btn sell">
        <span class="trade-btn-title">卖出</span>
        <span class="trade-btn-hint" id="sell-hint">可卖0/10仓</span>
      </button>
    </div>
  </div>

  <div id="log-panel">
    <div id="log-title">操作记录</div>
    <ul id="log-list"></ul>
  </div>

</div>

<div id="review-overlay" class="hidden">
  <div id="review-panel">
    <h2>揭晓</h2>
    <p id="review-identity"></p>
    <p id="review-dates"></p>

    <div id="review-chart-container"></div>

    <h3>权益曲线</h3>
    <div id="equity-chart-container"></div>

    <div id="review-stats"></div>

    <div id="review-actions">
      <button id="btn-export">导出本次训练JSON</button>
      <button id="btn-restart">开始新一轮训练</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
